spring:
  config:
    activate:
      on-profile: dev

# Base de datos local (update para crear automáticamente)
  datasource:
    url: jdbc:postgresql://localhost:5432/peliculas_dev
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Logging más detallado
logging:
  level:
    root: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Swagger habilitado en dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# CORS para frontend local
cors:
  allowed-origins: "http://localhost:5173, http://localhost:3000"